<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monaco Gherkin Editor</title>
</head>

<body>
    <div id="controls">
        <button id="run-btn">
            <span class="btn-icon">▶</span> Run Scenarios
        </button>
        <div style="flex:1"></div>
        <span id="status"></span>
        <button id="settings-toggle" title="Settings">&#x2699;</button>
    </div>

    <div id="settings-container"></div>

    <div id="editor-container"></div>
    <div id="resize-handle" title="Drag to resize"></div>
    <div id="output-container">
        <div id="output-header">
            <h3>Terminals</h3>
            <button id="clear-btn">Clear All</button>
        </div>
        <div id="terminals-list"></div>
    </div>
</body>

</html>
